<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Preview Kura-kura — Split View</title>
    <link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@400;600;700&family=Quicksand:wght@500;700&display=swap" rel="stylesheet">
    <style>
        * {
            font-family: 'Fredoka', 'Quicksand', sans-serif;
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }
        body {
            background: #0f172a;
            color: #fff;
            height: 100vh;
            overflow: hidden;
            display: grid;
            grid-template-rows: auto 1fr;
        }

        /* TOP BAR */
        #topbar {
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 12px;
            padding: 8px 16px;
            background: rgba(15, 23, 42, 0.7);
            backdrop-filter: blur(12px);
            border-bottom: 1px solid rgba(255,255,255,0.1);
            min-height: 64px;
        }
        .palette-h {
            display: flex;
            gap: 6px;
            padding: 4px 10px;
            background: rgba(2, 6, 23, 0.4);
            border-radius: 10px;
        }
        .swatch {
            width: 40px;
            height: 40px;
            border-radius: 50%;
            border: 3px solid rgba(255,255,255,0.6);
            box-shadow: 0 2px 8px rgba(0,0,0,0.5);
        }
        .score-badge {
            display: flex;
            align-items: center;
            gap: 8px;
            padding: 6px 18px;
            border-radius: 12px;
            font-weight: 800;
            font-size: 1.1rem;
        }
        .score-p1 { background: rgba(239, 68, 68, 0.25); border: 2px solid #ef4444; color: #fecaca; }
        .score-p2 { background: rgba(59, 130, 246, 0.25); border: 2px solid #3b82f6; color: #bfdbfe; }
        #round-info {
            font-size: 0.95rem;
            font-weight: 800;
            color: #fbbf24;
            letter-spacing: 1px;
            text-transform: uppercase;
        }
        .topbar-center {
            display: flex;
            align-items: center;
            gap: 10px;
            flex-shrink: 0;
        }

        /* STAGE SPLIT */
        #split {
            position: relative;
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 8px;
            padding: 8px;
            overflow: hidden;
        }
        .panel {
            position: relative;
            border-radius: 20px;
            overflow: hidden;
            background: rgba(15, 23, 42, 0.5);
            backdrop-filter: blur(10px);
            border: 2px solid;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        .panel.p1 {
            border-color: rgba(239, 68, 68, 0.5);
            justify-content: flex-start;
            padding-left: 30px;
        }
        .panel.p2 {
            border-color: rgba(59, 130, 246, 0.5);
            justify-content: flex-end;
            padding-right: 30px;
        }
        .panel svg {
            width: 85%;
            height: 100%;
            max-width: 85%;
            filter: drop-shadow(0 4px 16px rgba(0,0,0,0.6));
        }

        /* TARGET (TENGAH) */
        #target-panel {
            position: fixed;
            top: 90px;
            left: 50%;
            transform: translateX(-50%);
            width: 230px;
            height: 280px;
            background: rgba(15, 23, 42, 0.95);
            border: 2px solid rgba(251, 191, 36, 0.5);
            border-radius: 16px;
            padding: 8px;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: flex-start;
            z-index: 30;
            backdrop-filter: blur(10px);
            overflow: hidden;
        }
        #target-svg-holder {
            width: 100%;
            flex: 1;
            display: flex;
            align-items: center;
            justify-content: center;
            min-height: 0;
            overflow: hidden;
        }
        #target-panel .label {
            font-size: 0.85rem;
            color: #fbbf24;
            font-weight: 800;
            letter-spacing: 1px;
            text-transform: uppercase;
            width: 100%;
            text-align: center;
            padding-top: 6px;
            margin-top: 4px;
            border-top: 1px solid rgba(251, 191, 36, 0.25);
            flex-shrink: 0;
        }

        /* CHECKLIST */
        #checklist {
            position: fixed;
            bottom: 20px;
            left: 50%;
            transform: translateX(-50%);
            background: rgba(15, 23, 42, 0.95);
            border: 2px solid rgba(255,255,255,0.1);
            border-radius: 14px;
            padding: 8px 14px;
            z-index: 30;
            backdrop-filter: blur(10px);
            max-height: 32vh;
            overflow-y: auto;
        }
        #checklist-items {
            display: flex;
            flex-direction: column;
            gap: 2px;
        }
        .part-check {
            display: flex;
            align-items: center;
            gap: 10px;
            font-size: 0.75rem;
            padding: 3px 10px;
            white-space: nowrap;
        }
        .part-check .lbl {
            font-weight: 700;
            color: #e2e8f0;
            min-width: 90px;
            text-align: center;
            flex: 1;
        }
        .part-check .mark {
            width: 12px;
            height: 12px;
            border-radius: 50%;
            border: 2px solid rgba(255,255,255,0.3);
            flex-shrink: 0;
        }
        .part-check .mark.p1 { border-color: rgba(239, 68, 68, 0.5); }
        .part-check .mark.p2 { border-color: rgba(59, 130, 246, 0.5); }
    </style>
</head>
<body>
    <!-- TOP BAR -->
    <div id="topbar">
        <div class="palette-h" id="palette-p1"></div>
        <div class="topbar-center">
            <div class="score-badge score-p1">P1: 0</div>
            <div id="round-info">Ronde 1 / 5</div>
            <div class="score-badge score-p2">P2: 0</div>
        </div>
        <div class="palette-h" id="palette-p2"></div>
    </div>

    <!-- SPLIT -->
    <div id="split">
        <div class="panel p1" id="stage-p1"></div>
        <div class="panel p2" id="stage-p2"></div>
    </div>

    <!-- TARGET -->
    <div id="target-panel">
        <div id="target-svg-holder"></div>
        <div class="label">🎯 Target</div>
    </div>

    <!-- CHECKLIST -->
    <div id="checklist">
        <div id="checklist-items"></div>
    </div>

    <script src="characters.js"></script>
    <script>
        const PALETTE = ['#DC2626', '#F97316', '#FACC15', '#16A34A', '#2563EB', '#9333EA', '#64748B'];

        const colorsTarget = {
            shell: '#DC2626',
            shellLeft: '#16A34A',
            shellRight: '#FACC15',
            body: '#F97316',
            head: '#64748B',
            legs: '#9333EA',
            tail: '#2563EB'
        };

        const emptyColors = {
            shell: '#ffffff', shellLeft: '#ffffff', shellRight: '#ffffff',
            body: '#ffffff', head: '#ffffff', legs: '#ffffff', tail: '#ffffff'
        };

        // Render target (berwarna)
        document.getElementById('target-svg-holder').innerHTML =
            window.renderCharacter('turtle', colorsTarget);

        // Render P1 & P2 (putih)
        document.getElementById('stage-p1').innerHTML =
            window.renderCharacter('turtle', emptyColors);
        document.getElementById('stage-p2').innerHTML =
            window.renderCharacter('turtle', emptyColors);

        // Build palet
        ['p1', 'p2'].forEach(p => {
            const el = document.getElementById('palette-' + p);
            PALETTE.forEach(c => {
                const s = document.createElement('div');
                s.className = 'swatch';
                s.style.background = c;
                el.appendChild(s);
            });
        });

        // Build checklist
        const parts = [
            { key: 'shell', label: 'Rumah' },
            { key: 'shellLeft', label: 'Motif Kiri' },
            { key: 'shellRight', label: 'Motif Kanan' },
            { key: 'body', label: 'Badan' },
            { key: 'head', label: 'Kepala' },
            { key: 'legs', label: 'Kaki' },
            { key: 'tail', label: 'Ekor' }
        ];
        const cl = document.getElementById('checklist-items');
        parts.forEach(p => {
            const div = document.createElement('div');
            div.className = 'part-check';
            div.innerHTML = `
                <div class="mark p1"></div>
                <div class="lbl">${p.label}</div>
                <div class="mark p2"></div>
            `;
            cl.appendChild(div);
        });
    </script>
</body>
</html>
